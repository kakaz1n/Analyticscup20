<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drill board</title>
<style>
  :root { --ink:#0f172a; --muted:#475569; --bg:#f8fafc; --acc:#f59e0b; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 Inter,system-ui,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 16px; }
  h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--muted); font-size:13px; }
  .chips span { display:inline-block; background:#e2e8f0; border-radius:6px; padding:2px 7px; margin:4px 4px 0 0; font-size:12px; }
  .grid { display:grid; grid-template-columns: 1fr 330px; gap:14px; margin-top:10px; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  canvas { width:100%; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); background:#2e7d32; display:block; }
  .bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  button { font:inherit; border:1px solid #cbd5e1; background:#fff; border-radius:7px; padding:5px 10px; cursor:pointer; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=range] { flex:1; min-width:160px; }
  .cap { min-height:44px; background:#0f172a; color:#f8fafc; border-radius:8px; padding:8px 12px; font-size:14px; }
  .cap b { color:#fbbf24; }
  .side h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:10px 0 4px; }
  .side p, .side li { font-size:13px; margin:2px 0; } .side ul { margin:0; padding-left:18px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; margin-right:10px; font-size:12px; color:var(--muted); }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #111; }
  .meter { height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; } .meter i { display:block; height:100%; }
</style></head>
<body><div class="wrap">
  <h1 id="title">Drill board</h1>
  <div class="sub" id="sub">Loading the real situation…</div>
  <div class="chips" id="chips"></div>
  <div class="grid">
    <div>
      <div class="bar">
        <button id="m1">1 · What happened</button><button id="m2">2 · The drill: corrected</button><button id="m3">3 · Compare</button>
        <button id="demo" class="on">▶ Demo (1 → 2)</button>
      </div>
      <canvas id="cv" width="1400" height="860"></canvas>
      <div class="bar"><button id="play">⏸</button><input id="tl" type="range" min="0" max="1000" value="0"><span id="clock" class="sub">0.0 s</span>
        <button id="slow">0.5×</button></div>
      <div class="cap" id="cap"></div>
      <div class="legend" style="margin-top:6px">
        <span><i class="dot" style="background:#dc2626"></i>attack (as in the match)</span>
        <span><i class="dot" id="lgk"></i>defence</span><span><i class="dot" style="background:#4ade80"></i>defence in the drill (corrected)</span>
        <span><i class="dot" style="background:#facc15"></i>focus player</span><span>▲ cones · ▭ gates</span>
      </div>
    </div>
    <div class="side" id="side"></div>
  </div>
</div>
<script type="module" src="board.js"></script>
</body></html>
